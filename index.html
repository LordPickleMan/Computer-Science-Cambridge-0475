<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Representation & Boolean Logic: revision video</title>
<style>
:root{--bg:#eef2fa;--card:#fff;--ink:#14213d;--mute:#5b6784;--ac:#3a5bff;--on:#f2a900;--line:#d3dbed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--ink:#e9eefc;--mute:#9aa7c7;--ac:#7c9bff;--on:#f5b83d;--line:#2b3658}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--ink:#e9eefc;--mute:#9aa7c7;--ac:#7c9bff;--on:#f5b83d;--line:#2b3658}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{display:flex;justify-content:space-between;padding:10px 16px 6px;color:var(--mute);font-size:.9rem}
#track{height:4px;background:var(--line)}#bar{height:4px;width:0;background:var(--ac);transition:width .4s}
main{flex:1;overflow:auto;padding:18px 16px}
.sc{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.sc>*{margin:0;opacity:0;animation:in .45s forwards;animation-delay:calc(var(--i,0)*.35s)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sc>*{animation:none;opacity:1}}
h2{font-size:clamp(1.5rem,5.5vw,2.2rem);line-height:1.15;letter-spacing:-.01em}
.lead{font-size:1.15rem}.mute{color:var(--mute)}
ul{padding-left:1.2em}li{margin:4px 0}
.eq{font:700 1.1rem ui-monospace,Menlo,Consolas,monospace}
.warn{border-left:4px solid var(--on);padding:6px 12px;background:var(--card)}
.bits{display:flex;gap:4px}.bits.w{margin-top:1.4em}
.b{flex:1;max-width:56px;aspect-ratio:1;border:2px solid var(--ac);border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;font:700 1.15rem ui-monospace,Menlo,Consolas,monospace}
.b small{position:absolute;top:-1.4em;font-size:.62rem;color:var(--mute);font-weight:600}
.b.on{background:var(--on);border-color:var(--on);color:#14213d}
table{border-collapse:collapse;width:100%;font:600 .95rem ui-monospace,Menlo,Consolas,monospace}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center}th{background:var(--card)}
td.h{background:color-mix(in srgb,var(--on) 38%,transparent)}
.two{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.px{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:min(190px,48vw)}
.px i{aspect-ratio:1;background:var(--line)}.px i.on{background:var(--ac)}
#cap{background:var(--card);border-top:1px solid var(--line);padding:10px 16px;font-size:.95rem;min-height:4.2em;overflow:auto;max-height:22vh}
nav{display:flex;gap:8px;padding:8px 12px 10px;background:var(--card);flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#0e1424}}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:min(100%,300px)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body>
<header><span id="tag"></span><span id="pos"></span></header><div id="track"><div id="bar"></div></div>
<main id="st"></main><div id="cap" aria-live="polite"></div>
<nav><button id="pv">Back</button><button id="pl" class="p">Play</button><button id="nx">Next</button><button id="vo">Voice: on</button><button id="rs">Restart</button><select id="vs" aria-label="Choose a voice"></select><select id="sp" aria-label="Speaking speed"><option value=".8">Slow</option><option value=".92" selected>Normal</option><option value="1.05">Fast</option></select></nav>
<script>
const $=s=>document.querySelector(s),W=[128,64,32,16,8,4,2,1],W2=[-128,64,32,16,8,4,2,1];
const bits=(s,w)=>`<div class="bits${w?' w':''}">${[...s].map((c,i)=>`<div class="b${c==1?' on':''}">${w?`<small>${w[i]}</small>`:''}${c}</div>`).join('')}</div>`;
const tbl=(h,r)=>`<div style="overflow-x:auto"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(q=>`<tr>${q.map(v=>`<td${v===1?' class=h':''}>${v}</td>`).join('')}</tr>`).join('')}</table></div>`;
const P=[[0,0],[0,1],[1,0],[1,1]];
const gates=tbl(['A','B','NOT A','AND','OR','NAND','NOR','XOR'],P.map(([a,b])=>[a,b,1-a,a&b,a|b,1-(a&b),1-(a|b),a^b]));
const t3=tbl(['A','B','C','A AND B','NOT C','X'],[...Array(8).keys()].map(n=>{const a=n>>2,b=n>>1&1,c=n&1;return[a,b,c,a&b,1-c,(a&b)|(1-c)]}));
const face='00111100010000101010010110000001101001011001100101000010 00111100'.replace(' ','');
const px=[...face].map(c=>`<i class="${c==1?'on':''}"></i>`).join('');
const wave=()=>{let p='',d='';for(let x=0;x<=300;x+=4)p+=`${x?'L':'M'}${x} ${Math.round(40-28*Math.sin(x/24))} `;for(let x=0;x<=300;x+=20)d+=`<circle cx="${x}" cy="${Math.round(40-28*Math.sin(x/24))}" r="3.5" fill="var(--on)"/>`;return`<svg viewBox="0 0 300 80" style="width:100%;max-width:420px"><path d="${p}" fill="none" stroke="var(--ac)" stroke-width="2"/>${d}</svg>`};
const S=[
{c:'Overview',t:'Data representation and Boolean logic',h:`<p class=lead>Press <b>Play</b> to start. Pause on any slide to test yourself.</p><ul><li><b>Chapter 1:</b> binary, hex, addition, shifts, two’s complement, text, images, sound, storage, compression</li><li><b>Chapter 10:</b> logic gates, truth tables, expressions and circuits</li></ul><p class=mute>Computers are built from switches that are on or off, so everything is stored as 1s and 0s.</p>`,say:'This video covers two chapters. In Chapter 1, you will see how computers turn numbers, text, pictures and sound into ones and zeros. In Chapter 10, you will see how logic gates combine those ones and zeros to make decisions. Pause on any slide whenever you need more time.'},
{c:'Chapter 1: Data representation',t:'Binary and denary',h:`<p>Each bit has a place value. Add the values where there is a 1.</p>${bits('10011100',W)}<p class=eq>128 + 16 + 8 + 4 = 156</p><p class=mute>Denary to binary: subtract the biggest place value that fits, then repeat. 8 bits store 0 to 255.</p>`,say:'Binary is base two. Each bit has a place value that doubles from the right: one, two, four, eight, sixteen, thirty-two, sixty-four, one hundred and twenty-eight. To convert to denary, add the place values wherever there is a one. Here, one twenty-eight plus sixteen plus eight plus four makes one hundred and fifty-six. Eight bits can store zero to two hundred and fifty-five.'},
{c:'Chapter 1: Data representation',t:'Hexadecimal',h:`${bits('10011100',W)}<p class=eq>1001 = 9 &nbsp; 1100 = C &nbsp; so 10011100 = 9C</p><ul><li>Digits 0 to 9, then A=10, B=11, C=12, D=13, E=14, F=15</li><li>One hex digit = exactly 4 bits</li><li>Shorter, easier to read, fewer mistakes. Used for colour codes, memory addresses and error codes</li></ul>`,say:'Hexadecimal is base sixteen, using the digits zero to nine and the letters A to F. Each hex digit stands for exactly four bits. Split the binary into groups of four from the right: one-zero-zero-one is nine, and one-one-zero-zero is C, so the answer is nine C. Hex is shorter and easier to read and copy without mistakes. It is used for colour codes, memory addresses and error codes.'},
{c:'Chapter 1: Data representation',t:'Binary addition and overflow',h:`<p class=eq>0+0=0 &nbsp; 1+0=1 &nbsp; 1+1=10 (write 0, carry 1) &nbsp; 1+1+1=11</p>${bits('01101011')}${bits('00110101')}${bits('10100000')}<p class=eq>107 + 53 = 160</p><p class=warn><b>Overflow:</b> 200 + 100 = 300 needs 9 bits. An 8-bit register keeps only 00101100 (44), so the result is wrong.</p>`,say:'To add binary, remember that one plus one is one-zero: write zero and carry one. Here, one hundred and seven plus fifty-three gives one hundred and sixty. Overflow happens when the answer is too big for the bits available. Two hundred plus one hundred is three hundred, which needs nine bits. An eight-bit register keeps only the last eight, giving forty-four, which is wrong.'},
{c:'Chapter 1: Data representation',t:'Logical shifts',h:`<p>Left shift: multiply by 2 per place. Right shift: divide by 2 per place. Empty places fill with 0 and bits shifted off the end are lost.</p>${bits('00001011')}<p class=eq>11 shifted left 2 places = 44</p>${bits('00101100')}<p class=warn>200 (11001000) shifted left 1 loses the leading 1 and gives 144, not 400.</p>`,say:'A logical shift moves every bit left or right. Empty places fill with zeros, and bits pushed off the end are lost. Each left shift multiplies by two, and each right shift divides by two. Shifting eleven left by two places gives forty-four. But shifting two hundred left by one loses the leftmost one, so you get one hundred and forty-four instead of four hundred.'},
{c:'Chapter 1: Data representation',t:'Two’s complement',h:`<p>The left-most bit is worth −128. This is how negative numbers are stored.</p>${bits('11111011',W2)}<p class=eq>−128 + 64 + 32 + 16 + 8 + 2 + 1 = −5</p><ul><li>To make −5: write +5 (00000101), flip every bit (11111010), add 1 (11111011)</li><li>8-bit range: −128 to +127</li></ul>`,say:'Two’s complement stores negative numbers. The left-most bit has a negative place value of minus one twenty-eight. To make minus five, write plus five in binary, flip every bit, then add one. You get one-one-one-one-one-zero-one-one. Check it: minus one twenty-eight plus sixty-four, thirty-two, sixteen, eight, two and one makes minus five. In eight bits, the range is minus one twenty-eight to plus one twenty-seven.'},
{c:'Chapter 1: Data representation',t:'Text: ASCII and Unicode',h:`<p>A character set gives every character a unique code.</p>${bits('01000001',W)}<p class=eq>A = 65 &nbsp; D = 68 &nbsp; a = 97</p><ul><li>ASCII: 7 bits, 128 characters. Extended ASCII: 8 bits, 256</li><li>Unicode: more bits per character, so every language, symbols and emoji, but bigger files</li></ul>`,say:'Text is stored by giving every character a unique number, using a character set. ASCII uses seven bits, so it has one hundred and twenty-eight characters. Extended ASCII uses eight. Unicode uses more bits, so it can include every language, symbols and emoji, but files are bigger. Capital A is sixty-five, so D is sixty-eight. Lowercase letters have different codes: a is ninety-seven.'},
{c:'Chapter 1: Data representation',t:'Images',h:`<div class=two><div class=px>${px}</div><ul style="flex:1;min-width:200px"><li>Pixel = one dot, stored as a binary number</li><li>Resolution = width × height in pixels</li><li>Colour depth = bits per pixel (n bits = 2ⁿ colours)</li></ul></div><p class=eq>File size = width × height × colour depth</p><p>100 × 100 pixels at 8 bits = 80,000 bits = 10,000 bytes</p><p class=mute>Metadata (width, height, colour depth) is stored too. More pixels or depth = better quality but a bigger file.</p>`,say:'Images are grids of pixels, and each pixel is stored as a binary number. The number of bits per pixel is the colour depth, and n bits give two to the power n colours. Resolution is the width times the height in pixels. File size equals width times height times colour depth. A one hundred by one hundred image at eight bits is eighty thousand bits, or ten thousand bytes. Metadata like width, height and colour depth is stored too.'},
{c:'Chapter 1: Data representation',t:'Sound',h:`${wave()}<ul><li>Sample = a measurement of the wave. Sample rate = samples per second (Hz)</li><li>Bit depth = bits per sample</li><li>Higher rate and depth = better quality, bigger file</li></ul><p class=eq>File size = sample rate × bit depth × seconds</p><p>44,100 × 16 × 10 s = 7,056,000 bits</p>`,say:'Sound is analogue, so the computer measures the wave at regular intervals. Each measurement is a sample. The sample rate is how many samples are taken per second, in hertz. The bit depth is how many bits each sample uses. Higher values give better quality but bigger files. File size equals sample rate times bit depth times length in seconds. Forty-four thousand one hundred times sixteen times ten gives seven million, fifty-six thousand bits.'},
{c:'Chapter 1: Data representation',t:'Storage units and compression',h:`<p class=eq>4 bits = nibble &nbsp; 8 bits = byte<br>×1024: KiB, MiB, GiB, TiB, PiB</p><ul><li><b>Lossless</b> (e.g. run length encoding): no data lost, file rebuilt exactly</li><li><b>Lossy</b> (e.g. JPEG, MP3): data permanently removed, much smaller file</li><li>Why compress: less storage, faster sending</li></ul><p class=eq>AAAABBBCC → 4A 3B 2C</p>`,say:'Storage units go up in steps of one thousand and twenty-four. A nibble is four bits and a byte is eight. Then come kibibyte, mebibyte, gibibyte, tebibyte and pebibyte. Compression makes files smaller, so they use less storage and send faster. Lossless compression, like run length encoding, keeps all the data. Lossy compression, like JPEG and MP3, permanently removes data, so quality drops. Run length encoding turns A A A A B B B C C into four A, three B, two C.'},
{c:'Chapter 10: Boolean logic',t:'Logic gates',h:`<p>Inputs in, one output out. Highlighted cells are 1.</p>${gates}<ul><li>AND: both inputs 1. OR: at least one input 1</li><li>NAND = NOT AND. NOR = NOT OR</li><li>XOR: 1 only when the inputs are different</li></ul>`,say:'Chapter 10. A logic gate takes input bits and produces one output bit. NOT flips the input. AND outputs one only if both inputs are one. OR outputs one if at least one input is one. NAND is AND followed by NOT, and NOR is OR followed by NOT. XOR outputs one only when the inputs are different. Learn these tables, because they come up in every exam.'},
{c:'Chapter 10: Boolean logic',t:'Truth tables for expressions',h:`<p class=eq>X = (A AND B) OR (NOT C)</p>${t3}<p class=mute>n inputs = 2ⁿ rows. Count in binary so you never miss a row. Work brackets first, then NOT, then combine.</p>`,say:'A truth table lists every possible input combination. With n inputs there are two to the power n rows, so three inputs means eight rows. For X equals A AND B, OR NOT C, work column by column. Do the brackets first, then NOT, then combine. Write the inputs in binary counting order so you never miss a row.'},
{c:'Chapter 10: Boolean logic',t:'Circuits and expressions',h:`<ul><li>NOT: triangle with a small circle</li><li>AND: flat back, curved front</li><li>OR: curved back, pointed front</li><li>NAND and NOR: add a small circle at the output</li><li>XOR: OR with an extra curved line at the back</li></ul><p class=warn>Circuit to table: label every gate’s output, then add a column for each label. Expression to circuit: draw the innermost bracket first. Exam circuits have up to three inputs and one output.</p>`,say:'In a logic circuit, NOT is a triangle with a small circle. AND has a flat back and a curved front. OR has a curved back and a pointed front. NAND and NOR add a circle at the output, and XOR has an extra curved line at the back. To work out a circuit, label the output of every gate, then fill in a column for each label. To go from an expression to a circuit, draw the innermost bracket first. Exam circuits have up to three inputs and one output.'},
{c:'Recap',t:'Last-minute checklist',h:`<ul><li>Place values double from the right: 128, 64, 32, 16, 8, 4, 2, 1</li><li>1 hex digit = 4 bits. Watch for overflow</li><li>Two’s complement: flip the bits, add 1</li><li>Image size = width × height × depth. Sound size = rate × depth × seconds</li><li>Truth table rows = 2ⁿ. Learn all six gate tables</li></ul><p class=lead>Hit Restart, then try past-paper questions on each slide.</p>`,say:'Quick recap. Binary place values double from the right. One hex digit equals four bits. Watch for overflow. Two’s complement means flip the bits and add one. Image size is width times height times depth, and sound size is sample rate times depth times seconds. A truth table has two to the power n rows, and you must learn all six gate tables. Now restart and try past paper questions on each topic. Good luck.'}
];
let i=0,play=0,voice=1,tm,tok=0,VL=[];const syn=window.speechSynthesis;
const sc=v=>(/natural|neural|online/i.test(v.name)?6:0)+(/premium|enhanced|siri/i.test(v.name)?5:0)+(/google/i.test(v.name)?3:0)+(/^en[-_](GB|US|AU|IN)/i.test(v.lang)?1:0)-(/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph)\b/.test(v.name)?10:0);
function loadVoices(){const cur=$('#vs').value;VL=syn.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>sc(b)-sc(a));
$('#vs').innerHTML=VL.length?VL.map((v,k)=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${k<3?'★ ':''}${v.name} (${v.lang})</option>`).join(''):'<option>Default voice</option>';
let saved='';try{saved=localStorage.getItem('voice')||''}catch(e){}
const want=cur||saved;if(want&&VL.some(v=>v.voiceURI===want))$('#vs').value=want}
const pick=()=>VL.find(v=>v.voiceURI===$('#vs').value)||VL[0];
if(syn){loadVoices();syn.onvoiceschanged=loadVoices}
function show(n){tok++;clearTimeout(tm);syn&&syn.cancel();i=Math.max(0,Math.min(S.length-1,n));const s=S[i];
$('#st').innerHTML=`<section class=sc><h2>${s.t}</h2>${s.h}</section>`;[...$('#st').firstChild.children].forEach((e,k)=>e.style.setProperty('--i',k));$('#st').scrollTop=0;
$('#tag').textContent=s.c;$('#pos').textContent=`${i+1} / ${S.length}`;$('#bar').style.width=(i+1)/S.length*100+'%';$('#cap').textContent=s.say;if(play)speak()}
function speak(){const id=tok,s=S[i];const next=()=>{if(id!==tok||!play)return;i<S.length-1?show(i+1):setPlay(0)};
if(voice&&syn){const parts=s.say.match(/[^.!?]+[.!?]*/g).map(x=>x.trim()).filter(Boolean),rate=+$('#sp').value;parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p),v=pick();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';u.rate=rate;u.pitch=1;if(k===parts.length-1)u.onend=()=>{if(id===tok){clearTimeout(tm);tm=setTimeout(next,1200)}};syn.speak(u)});tm=setTimeout(next,4000+s.say.length*110/rate)}
else tm=setTimeout(next,2500+s.say.length*55)}
function setPlay(v){play=v;$('#pl').textContent=v?'Pause':'Play';if(v)speak();else{tok++;clearTimeout(tm);syn&&syn.cancel()}}
$('#pl').onclick=()=>setPlay(!play);$('#nx').onclick=()=>show(i+1);$('#pv').onclick=()=>show(i-1);
$('#rs').onclick=()=>{show(0);setPlay(1)};
function redo(sample){tok++;clearTimeout(tm);syn&&syn.cancel();if(play)speak();else if(sample&&voice&&syn){const u=new SpeechSynthesisUtterance('Hi, this is how I sound. Press play to hear the lesson.'),v=pick();if(v){u.voice=v;u.lang=v.lang}u.rate=+$('#sp').value;syn.speak(u)}}
$('#vs').onchange=()=>{try{localStorage.setItem('voice',$('#vs').value)}catch(e){}redo(1)};
$('#sp').onchange=()=>redo(0);
$('#vo').onclick=()=>{voice=!voice;$('#vo').textContent='Voice: '+(voice?'on':'off');if(play){show(i)}};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1);if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlay(!play)}});
show(0);
</script></body></html>
